<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 352" width="720" height="352" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a3a38"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b23a48"/></marker>
    <marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b4a9e"/></marker>
    <style>
      .h{font-size:12.5px;font-weight:700;fill:#1a1a1a}
      .m{font-size:11.5px;font-weight:700;fill:#1a1a1a}
      .s{font-size:10.5px;fill:#4a4a48}
      .n{font-size:10.5px;fill:#1a1a1a}
      .lp{font-size:10.5px;fill:#b23a48}
      .li{font-size:10.5px;fill:#5b4a9e}
      .bp{font-size:11px;font-weight:700;fill:#b23a48}
      .bi{font-size:11px;font-weight:700;fill:#5b4a9e}
      .mod{fill:#ffffff;stroke:#6b6b68;stroke-width:0.9}
      .wp{stroke:#b23a48;stroke-width:1.8;fill:none}
      .wi{stroke:#5b4a9e;stroke-width:1.8;fill:none}
      .w{stroke:#3a3a38;stroke-width:1.5;fill:none}
      .wd{stroke:#3a3a38;stroke-width:1.5;fill:none;stroke-dasharray:4 3}
    </style>
  </defs>
  <rect width="720" height="352" fill="#ffffff"/>

  <!-- 하드웨어 블록 -->
  <rect x="6" y="6" width="128" height="340" rx="2" fill="#f4f4f2" stroke="#6b6b68" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="13" y="24" class="h">하드웨어 블록</text>
  <text x="13" y="39" class="s">이마 센서 보드</text>
  <rect x="13" y="50" width="114" height="38" rx="2" class="mod"/>
  <text x="70" y="66" class="m" text-anchor="middle">LED · PD</text>
  <text x="70" y="81" class="s" text-anchor="middle">520 nm 반사형</text>
  <rect x="13" y="110" width="114" height="38" rx="2" class="mod"/>
  <text x="70" y="126" class="m" text-anchor="middle">AFE</text>
  <text x="70" y="141" class="s" text-anchor="middle">TIA · 0.16–16 Hz</text>
  <rect x="13" y="170" width="114" height="38" rx="2" class="mod"/>
  <text x="70" y="186" class="m" text-anchor="middle">ADC MCP3421</text>
  <text x="70" y="201" class="s" text-anchor="middle">12 b · 240 SPS</text>
  <rect x="13" y="262" width="114" height="38" rx="2" class="mod"/>
  <text x="70" y="278" class="m" text-anchor="middle">IMU ICM-42670-P</text>
  <text x="70" y="293" class="s" text-anchor="middle">6축 · 100 Hz</text>
  <path d="M70,88 V108" class="wp" marker-end="url(#ap)"/>
  <path d="M70,148 V168" class="wp" marker-end="url(#ap)"/>

  <!-- I2C 버스 -->
  <text x="164" y="252" class="n" text-anchor="middle" transform="rotate(-90 164 252)" dy="4">I²C 100 kHz</text>

  <!-- SoC -->
  <rect x="180" y="6" width="430" height="340" rx="2" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="190" y="24" class="h">졸음 감지 SoC <tspan class="s" font-weight="400">(FPGA 구현 · 12 MHz 단일 클럭)</tspan></text>

  <!-- 신호처리 블록 -->
  <rect x="190" y="34" width="116" height="304" rx="2" fill="#eef3fa" stroke="#3a6ea5" stroke-width="1.2"/>
  <text x="248" y="52" class="h" text-anchor="middle">신호처리 블록</text>
  <rect x="197" y="64" width="102" height="138" rx="2" class="mod"/>
  <text x="248" y="81" class="bp" text-anchor="middle">PPG</text>
  <text x="248" y="101" class="n" text-anchor="middle">기저선 제거 · FIR</text>
  <text x="248" y="119" class="n" text-anchor="middle">신호 품질 검사</text>
  <text x="248" y="137" class="n" text-anchor="middle">피크 검출 → RR</text>
  <text x="248" y="155" class="n" text-anchor="middle">5 s 블록 누산</text>
  <text x="248" y="173" class="n" text-anchor="middle">→ 60 s 창 합</text>
  <rect x="197" y="216" width="102" height="110" rx="2" class="mod"/>
  <text x="248" y="233" class="bi" text-anchor="middle">IMU</text>
  <text x="248" y="253" class="n" text-anchor="middle">가속도 전달</text>
  <text x="248" y="271" class="n" text-anchor="middle">자이로 끄덕임 검출</text>
  <text x="248" y="289" class="n" text-anchor="middle">착용 방향 판별</text>

  <!-- 신호처리 → 판정 -->
  <text x="334" y="124" class="lp" text-anchor="middle">창 합 ×3</text>
  <text x="334" y="149" class="lp" text-anchor="middle">33 b / 5 s</text>
  <text x="334" y="262" class="li" text-anchor="middle">가속도</text>
  <text x="334" y="287" class="li" text-anchor="middle">끄덕임</text>

  <!-- 판정 블록 -->
  <rect x="362" y="34" width="144" height="304" rx="2" fill="#fbf1ea" stroke="#c0692e" stroke-width="1.2"/>
  <text x="434" y="52" class="h" text-anchor="middle">판정 블록</text>
  <rect x="370" y="97" width="72" height="72" rx="2" class="mod"/>
  <text x="406" y="119" class="m" text-anchor="middle">심박 판정</text>
  <text x="406" y="137" class="s" text-anchor="middle">기준선 대비</text>
  <text x="406" y="153" class="s" text-anchor="middle">판정 보류</text>
  <rect x="370" y="235" width="72" height="72" rx="2" class="mod"/>
  <text x="406" y="257" class="m" text-anchor="middle">고개 떨굼</text>
  <text x="406" y="275" class="s" text-anchor="middle">숙임 · 끄덕임</text>
  <text x="406" y="291" class="s" text-anchor="middle">상시 감시</text>
  <text x="478" y="259" class="s" text-anchor="middle">경보</text>
  <text x="478" y="273" class="s" text-anchor="middle">결합</text>
  <text x="521" y="208" class="n" text-anchor="middle">alert</text>

  <!-- 통신 블록 -->
  <rect x="536" y="34" width="64" height="304" rx="2" fill="#eaf5ef" stroke="#2e8b62" stroke-width="1.2"/>
  <text x="568" y="52" class="h" text-anchor="middle">통신 블록</text>
  <rect x="543" y="194" width="50" height="44" rx="2" class="mod"/>
  <text x="568" y="212" class="m" text-anchor="middle">UART</text>
  <text x="568" y="228" class="s" text-anchor="middle">9600 bps</text>

  <!-- 외부 -->
  <text x="618" y="208" class="n" text-anchor="middle">TX</text>
  <rect x="628" y="188" width="86" height="56" rx="2" class="mod"/>
  <text x="671" y="206" class="m" text-anchor="middle">BLE 모듈</text>
  <text x="671" y="222" class="s" text-anchor="middle">JDY-23</text>
  <text x="671" y="236" class="s" text-anchor="middle">보드 실장</text>
  <path d="M671,244 V274" class="wd" marker-end="url(#ag)"/>
  <text x="678" y="263" class="s">BLE</text>
  <rect x="628" y="276" width="86" height="44" rx="2" class="mod"/>
  <text x="671" y="294" class="m" text-anchor="middle">스마트폰</text>
  <text x="671" y="310" class="s" text-anchor="middle">경보 수신</text>

  <!-- 범례 -->
  <path d="M630,48 H648" class="wp"/>
  <text x="653" y="52" class="n">PPG 경로</text>
  <path d="M630,66 H648" class="wi"/>
  <text x="653" y="70" class="n">IMU 경로</text>
  <!-- 연결선: 블록 바탕에 가리지 않도록 맨 마지막에 그린다 -->
  <path d="M127,189 H148 V281 H127" class="w"/>
  <path d="M148,209 H190" class="w" marker-end="url(#ag)"/>
  <path d="M299,133 H369" class="wp" marker-end="url(#ap)"/>
  <path d="M299,271 H369" class="wi" marker-end="url(#ai)"/>
  <path d="M442,133 H452 V204 H466" class="wp"/>
  <path d="M442,271 H452 V228 H466" class="wi"/>
  <path d="M498,216 H542" class="w" marker-end="url(#ag)"/>
  <path d="M593,216 H627" class="w" marker-end="url(#ag)"/>
  <path d="M460,192 Q474,216 460,240 Q486,240 498,216 Q486,192 460,192 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
</svg>
